<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>BidBrief - AI Document Analysis</title>
    <meta name="description" content="BidBrief reads a full engineering or construction document set — and legal, medical, real-estate and diligence documents too — answering questions with every answer cited back to the page.">

    <!-- Same card as /login, so a shared link looks identical whether or not the
         person sharing it happens to be signed in. Absolute URLs required. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BidBrief">
    <meta property="og:title" content="BidBrief — read the whole spec before you price it">
    <meta property="og:description" content="Upload the document set. Ask questions in plain language. Every answer cited back to the page.">
    <meta property="og:url" content="https://bidbrief.onrender.com/">
    <meta property="og:image" content="https://bidbrief.onrender.com/pics/og-bidbrief.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="BidBrief — AI document intelligence.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BidBrief — read the whole spec before you price it">
    <meta name="twitter:description" content="Upload the document set. Ask questions. Get cited answers.">
    <meta name="twitter:image" content="https://bidbrief.onrender.com/pics/og-bidbrief.png">

    <!-- The btools.ai aperture. SVG first (crisp at any density, recolours
         nothing at render time); the PNGs are the fallback for browsers that
         still ignore image/svg+xml favicons. -->
    <link rel="icon" type="image/svg+xml" href="/pics/brand/btools-aperture.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/pics/brand/btools-aperture-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/pics/brand/btools-aperture-16.png">
    <link rel="apple-touch-icon" href="/pics/brand/btools-aperture-180.png">
    <link rel="stylesheet" href="/shared/assets/css/bb-theme.css">
    <link rel="stylesheet" href="/shared/assets/css/bb-orb.css">
    <link rel="stylesheet" href="/shared/assets/css/bb-screens.css">
</head>
<body>
    <!-- The suspended planet, behind everything. -->
    <div id="bb-orb" class="bb-orb-host" aria-hidden="true">
        <canvas class="bb-orb-stars"></canvas>
        <div class="bb-orb-halo"></div>
        <div class="bb-orb-planet"></div>
        <svg class="bb-orb-mark" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <radialGradient id="bbOrbCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6df"/><stop offset="45%" stop-color="#ecc766"/>
          <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bbOrbBlade" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f2d789"/><stop offset="100%" stop-color="#a3801e"/>
        </linearGradient>
      </defs>
      <g fill="url(#bbOrbBlade)">
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(0 60 60)"/>
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(40 60 60)"/>
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(80 60 60)"/>
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(120 60 60)"/>
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(160 60 60)"/>
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(200 60 60)"/>
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(240 60 60)"/>
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(280 60 60)"/>
        <path d="M60 60 L60 14 L67 22 L64 58 Z" transform="rotate(320 60 60)"/>
      </g>
      <circle cx="60" cy="60" r="17" fill="url(#bbOrbCore)"/>
      <circle cx="60" cy="60" r="6" fill="#fff6df"/>
    </svg>
        <div class="bb-orb-gleam"></div>
        <div class="bb-orb-ring"></div>
        <div class="bb-orb-moon"></div>
        <div class="bb-orb-scrim-top"></div>
        <div class="bb-orb-scrim-bottom"></div>
    </div>

    <main class="bb-app">
        <section id="bb-page-analyze"   class="bb-page"></section>
        <section id="bb-page-questions" class="bb-page" hidden></section>
        <section id="bb-page-admin"     class="bb-page" hidden></section>
        <section id="bb-page-settings"  class="bb-page" hidden></section>
    </main>

    <nav id="bb-tabbar" class="bb-tabbar" aria-label="Primary"></nav>
    <div id="bb-banner-host"></div>
    <div id="bb-modal-host"></div>

    <script src="/shared/assets/js/bb-ui.js"></script>
    <script src="/shared/assets/js/bb-orb.js"></script>
    <script src="/shared/assets/js/bb-state.js"></script>
    <script src="/shared/assets/js/bb-status.js"></script>
    <script src="/shared/assets/js/bb-shell.js"></script>
    <script src="/shared/assets/js/bb-engine.js"></script>
    <script src="/shared/assets/js/bb-progress.js"></script>
    <script src="/shared/assets/js/bb-results.js"></script>
    <script src="/shared/assets/js/bb-analyze.js"></script>
    <script src="/shared/assets/js/bb-libraries.js"></script>
    <script src="/shared/assets/js/bb-qgen.js"></script>
    <script src="/shared/assets/js/bb-questionhub.js"></script>
    <script src="/shared/assets/js/bb-scraper.js"></script>
    <script src="/shared/assets/js/bb-admin.js"></script>
    <script src="/shared/assets/js/bb-settings.js"></script>
    <script src="/shared/assets/js/bb-boot.js"></script>
</body>
</html>
