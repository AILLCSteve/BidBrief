<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidBrief - Login</title>
    <link rel="icon" type="image/png" href="/pics/AILLCfavicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/pics/AILLCLogo.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            filter: brightness(0.65);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(91, 127, 204, 0.5) 0%, rgba(30, 58, 138, 0.6) 100%);
            z-index: -1;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            height: 60px;
            width: auto;
        }

        h1 {
            color: #1E3A8A;
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #5B7FCC;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .tagline {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f9fafb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #5B7FCC;
            background: white;
            box-shadow: 0 0 0 3px rgba(91, 127, 204, 0.15);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #1E3A8A 0%, #5B7FCC 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .footer p {
            color: #9ca3af;
            font-size: 12px;
        }

        .footer a {
            color: #5B7FCC;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 25px 0;
        }

        .feature {
            text-align: center;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .feature-text {
            font-size: 11px;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 40px 25px;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/pics/AILLCLogoNOBG.png" alt="Additional Intelligence LLC">
        </div>

        <h1>BidBrief</h1>
        <p class="subtitle">AI-Powered Document Analysis</p>
        <p class="tagline">Extract insights from bid documents with precision</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">AI</div>
                <div class="feature-text">Smart Analysis</div>
            </div>
            <div class="feature">
                <div class="feature-icon">PDF</div>
                <div class="feature-text">PDF Support</div>
            </div>
            <div class="feature">
                <div class="feature-icon">XLS</div>
                <div class="feature-text">Excel Export</div>
            </div>
        </div>

        <form id="loginForm" action="/auth/login" method="POST">
            <div id="errorMessage" class="error-message"></div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="footer">
            <p>Powered by <a href="https://additionalintel.com" target="_blank">Additional Intelligence LLC</a></p>
        </div>
    </div>

    <script>
        // Check for error parameter in URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');

        if (error) {
            const errorDiv = document.getElementById('errorMessage');
            if (error === 'invalid') {
                errorDiv.textContent = 'Invalid username or password. Please try again.';
            } else if (error === 'session') {
                errorDiv.textContent = 'Your session has expired. Please log in again.';
            } else {
                errorDiv.textContent = 'An error occurred. Please try again.';
            }
            errorDiv.classList.add('show');
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                e.preventDefault();
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = 'Please enter both username and password.';
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
