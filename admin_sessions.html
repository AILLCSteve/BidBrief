<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidBrief - Admin Panel</title>
    <link rel="icon" type="image/png" href="/pics/AILLCfavicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1E3A8A 0%, #5B7FCC 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1E3A8A;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 img {
            height: 40px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1E3A8A 0%, #5B7FCC 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .section h2 {
            color: #1E3A8A;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #5B7FCC;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active { background: #3b82f6; color: white; }
        .status-completed { background: #22c55e; color: white; }
        .status-partial { background: #f59e0b; color: white; }
        .status-legacy { background: #6b7280; color: white; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #f3f4f6;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
            font-size: 13px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
            font-size: 13px;
        }

        tr:hover { background: #f9fafb; }

        .session-id {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #5B7FCC;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #1E3A8A 0%, #5B7FCC 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .refresh-btn:hover { transform: translateY(-2px); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .action-btn {
            background: #5B7FCC;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-right: 5px;
            transition: background 0.2s;
        }

        .action-btn:hover { background: #1E3A8A; }
        .action-btn.export { background: #22c55e; }
        .action-btn.export:hover { background: #16a34a; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }

        .modal-content {
            background-color: white;
            margin: 30px auto;
            border-radius: 15px;
            width: 95%;
            max-width: 1400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: linear-gradient(135deg, #1E3A8A 0%, #5B7FCC 100%);
            color: white;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.3em;
        }

        .close-btn {
            font-size: 24px;
            color: white;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover { background: rgba(255,255,255,0.3); }

        /* Tab Styles */
        .tab-container {
            border-bottom: 2px solid #e5e7eb;
            background: #f9fafb;
        }

        .tab-buttons {
            display: flex;
            gap: 0;
        }

        .tab-btn {
            padding: 15px 25px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: #f3f4f6;
            color: #1E3A8A;
        }

        .tab-btn.active {
            color: #1E3A8A;
            border-bottom-color: #1E3A8A;
            background: white;
        }

        .tab-content {
            display: none;
            padding: 25px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .tab-content.active { display: block; }

        /* Results Tables */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .results-table th {
            background: #1E3A8A;
            color: white;
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .results-table td {
            padding: 10px;
            border: 1px solid #e5e7eb;
            vertical-align: top;
        }

        .results-table tr:nth-child(even) { background: #f9fafb; }

        .answer-cell {
            max-width: 400px;
            word-wrap: break-word;
        }

        .pages-cell {
            font-weight: 600;
            color: #1E3A8A;
            text-align: center;
            white-space: nowrap;
        }

        .status-yes {
            background: #d4edda;
            color: #155724;
            font-weight: 600;
            text-align: center;
        }

        .status-no {
            background: #f8d7da;
            color: #721c24;
            font-style: italic;
            text-align: center;
        }

        .section-header-row {
            background: #e8eef7 !important;
        }

        .section-header-row td {
            font-weight: 600;
            color: #1E3A8A;
            padding: 15px 10px;
        }

        /* Stats Box */
        .stats-box {
            background: #f0f4ff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .stat-item value {
            display: block;
            font-size: 18px;
            font-weight: 600;
            color: #1E3A8A;
        }

        .back-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .back-link:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>
                    <img src="/pics/AILLCLogoNOBG.png" alt="BidBrief">
                    BidBrief Admin Panel
                </h1>
                <a href="/" class="back-link">← Back to Analysis</a>
            </div>
            <p style="color: #6b7280; margin-top: 10px;">Monitor and manage all analysis sessions</p>

            <div class="summary" id="summary">
                <div class="stat-card">
                    <h3>Total Sessions</h3>
                    <div class="number" id="total">0</div>
                </div>
                <div class="stat-card">
                    <h3>Active</h3>
                    <div class="number" id="active-count">0</div>
                </div>
                <div class="stat-card">
                    <h3>Completed</h3>
                    <div class="number" id="completed-count">0</div>
                </div>
                <div class="stat-card">
                    <h3>Partial</h3>
                    <div class="number" id="partial-count">0</div>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button class="refresh-btn" onclick="loadSessions()">Refresh</button>
                <span id="last-updated" style="margin-left: 15px; color: #6b7280; font-size: 14px;"></span>
            </div>
        </div>

        <div id="error-container"></div>

        <div class="section" id="active-section" style="display: none;">
            <h2>Active Analyses</h2>
            <div id="active-content"></div>
        </div>

        <div class="section" id="completed-section" style="display: none;">
            <h2>Completed Analyses</h2>
            <div id="completed-content"></div>
        </div>

        <div class="section" id="partial-section" style="display: none;">
            <h2>Partial/Stopped Analyses</h2>
            <div id="partial-content"></div>
        </div>
    </div>

    <!-- Analysis Results Modal with 3 Tabs -->
    <div id="resultsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Analysis Results</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-container">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('summary')">Summary</button>
                    <button class="tab-btn" onclick="switchTab('detailed')">Detailed Results</button>
                    <button class="tab-btn" onclick="switchTab('bySection')">By Section</button>
                    <button class="tab-btn" id="fragmentsTabBtn" style="display: none;" onclick="switchTab('fragments')">All Fragments</button>
                    <button class="tab-btn" onclick="switchTab('footnotes')">Footnotes</button>
                    <button class="tab-btn" id="pageIndexTabBtn" style="display: none;" onclick="switchTab('pageIndex')">Page Index</button>
                    <button class="tab-btn" id="optimizedScanTabBtn" style="display: none;" onclick="switchTab('optimizedScan')">Optimized Scan</button>
                </div>
            </div>

            <!-- Tab Content -->
            <div id="tab-summary" class="tab-content active">
                <div id="summaryContent"></div>
            </div>
            <div id="tab-detailed" class="tab-content">
                <div id="detailedContent"></div>
            </div>
            <div id="tab-bySection" class="tab-content">
                <div id="bySectionContent"></div>
            </div>
            <div id="tab-fragments" class="tab-content">
                <div id="fragmentsContent"></div>
            </div>
            <div id="tab-footnotes" class="tab-content">
                <div id="footnotesContent"></div>
            </div>
            <div id="tab-pageIndex" class="tab-content">
                <div id="pageIndexContent"></div>
            </div>
            <div id="tab-optimizedScan" class="tab-content">
                <div id="optimizedScanContent"></div>
            </div>
        </div>
    </div>

    <script>
        let currentResults = null;

        function formatDateTime(isoString) {
            if (!isoString) return 'N/A';
            return new Date(isoString).toLocaleString();
        }

        function formatDuration(seconds) {
            if (!seconds) return 'N/A';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}m ${secs}s`;
        }

        function createSessionTable(sessions, statusClass) {
            if (sessions.length === 0) {
                return '<div class="empty-state">No sessions in this category</div>';
            }

            let html = '<table><thead><tr>';
            html += '<th>PDF File</th>';
            html += '<th>Mode</th>';
            html += '<th>Status</th>';
            html += '<th>Questions</th>';
            html += '<th>Pages</th>';
            html += '<th>Tokens</th>';
            html += '<th>Time</th>';
            html += '<th>Completed</th>';
            html += '<th>Actions</th>';
            html += '</tr></thead><tbody>';

            sessions.forEach(session => {
                const mode = session.mode || 'bid_spec';
                const modeBadge = mode === 'bestprep'
                    ? '<span style="background: #22c55e; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px;">BestPrep</span>'
                    : '<span style="background: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px;">Bid/Spec</span>';

                html += '<tr>';
                html += `<td style="font-weight: 600; color: #1E3A8A;" title="${session.pdf_path || 'N/A'}">${session.pdf_filename || 'Unknown.pdf'}</td>`;
                html += `<td>${modeBadge}</td>`;
                html += `<td><span class="status-badge status-${statusClass}">${session.status}</span></td>`;
                html += `<td>${session.questions_answered || 'N/A'}</td>`;
                html += `<td>${session.total_pages || 'N/A'}</td>`;
                html += `<td>${session.total_tokens ? session.total_tokens.toLocaleString() : 'N/A'}</td>`;
                html += `<td>${formatDuration(session.processing_time)}</td>`;
                html += `<td>${formatDateTime(session.completed_at || session.stopped_at)}</td>`;
                html += `<td>
                    <button class="action-btn" onclick="viewAnalysis('${session.session_id}', '${session.pdf_filename || 'Unknown.pdf'}')">View</button>
                    <button class="action-btn export" onclick="exportAnalysis('${session.session_id}', '${mode}')">Export</button>
                </td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        async function loadSessions() {
            try {
                const response = await fetch('/api/admin/sessions');
                const data = await response.json();

                if (!data.success) throw new Error(data.error || 'Failed to load sessions');

                document.getElementById('total').textContent = data.summary.total_sessions;
                document.getElementById('active-count').textContent = data.summary.active_count;
                document.getElementById('completed-count').textContent = data.summary.completed_count;
                document.getElementById('partial-count').textContent = data.summary.partial_count;

                const activeSection = document.getElementById('active-section');
                if (data.sessions.active.length > 0) {
                    activeSection.style.display = 'block';
                    document.getElementById('active-content').innerHTML = createSessionTable(data.sessions.active, 'active');
                } else {
                    activeSection.style.display = 'none';
                }

                const completedSection = document.getElementById('completed-section');
                if (data.sessions.completed.length > 0) {
                    completedSection.style.display = 'block';
                    document.getElementById('completed-content').innerHTML = createSessionTable(data.sessions.completed, 'completed');
                } else {
                    completedSection.style.display = 'none';
                }

                const partialSection = document.getElementById('partial-section');
                if (data.sessions.partial.length > 0) {
                    partialSection.style.display = 'block';
                    document.getElementById('partial-content').innerHTML = createSessionTable(data.sessions.partial, 'partial');
                } else {
                    partialSection.style.display = 'none';
                }

                document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
                document.getElementById('error-container').innerHTML = '';

            } catch (error) {
                console.error('Failed to load sessions:', error);
                document.getElementById('error-container').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        async function viewAnalysis(sessionId, pdfFilename) {
            const modal = document.getElementById('resultsModal');
            const modalTitle = document.getElementById('modalTitle');

            modal.style.display = 'block';
            modalTitle.textContent = pdfFilename || 'Analysis Results';

            // Show loading state
            document.getElementById('summaryContent').innerHTML = '<div style="text-align: center; padding: 40px; color: #5B7FCC;">Loading...</div>';
            document.getElementById('detailedContent').innerHTML = '';
            document.getElementById('bySectionContent').innerHTML = '';

            // Reset to first tab
            switchTab('summary');

            try {
                const response = await fetch(`/api/results/${sessionId}`);
                const data = await response.json();

                if (!data.success) throw new Error(data.error || 'Failed to load results');

                currentResults = data;
                renderAllTabs(data, sessionId);

            } catch (error) {
                console.error('Failed to view analysis:', error);
                document.getElementById('summaryContent').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function renderAllTabs(data, sessionId) {
            // Detect mode from result data
            const mode = data.mode || 'bid_spec';

            // Add mode indicator to modal title
            const modalTitle = document.getElementById('modalTitle');
            if (mode === 'bestprep') {
                modalTitle.innerHTML += ' <span style="background: #22c55e; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px;">BestPrep Mode</span>';
                // Show Fragments and Page Index tabs for BestPrep mode
                document.getElementById('fragmentsTabBtn').style.display = 'inline-block';
                document.getElementById('pageIndexTabBtn').style.display = 'inline-block';
            } else {
                // Hide BestPrep-specific tabs for Bid/Spec mode
                document.getElementById('fragmentsTabBtn').style.display = 'none';
                document.getElementById('pageIndexTabBtn').style.display = 'none';
            }

            // Show Optimized Scan tab for V2 pipeline analyses
            if (data.optimized_scan_data && Object.keys(data.optimized_scan_data).length > 0) {
                document.getElementById('optimizedScanTabBtn').style.display = 'inline-block';
                renderOptimizedScanTab(data.optimized_scan_data);
            } else {
                document.getElementById('optimizedScanTabBtn').style.display = 'none';
            }

            renderSummaryTab(data, sessionId, mode);
            renderDetailedTab(data, mode);
            renderBySectionTab(data, mode);
            if (mode === 'bestprep') {
                renderFragmentsTab(data);
                renderPageIndexTab(data);
            }
            renderFootnotesTab(data);
        }

        // Key requirement patterns for extraction
        const KEY_REQUIREMENT_PATTERNS = {
            'Project Name': ['project name', 'project title', 'contract name', 'project no', 'project number'],
            'Owner/Agency': ['owner', 'agency', 'municipality', 'city of', 'county of', 'district'],
            'Engineer': ['engineer', 'designer', 'architect', 'design firm', 'engineering firm'],
            'Timeline': ['timeline', 'project duration', 'start date', 'completion date', 'schedule', 'substantial completion'],
            'Scope': ['scope', 'linear feet', 'pipe diameter', 'total footage', 'project scope', 'lf of'],
            'Bid Deadline': ['bid deadline', 'bid due', 'submission deadline', 'bid opening', 'bids due'],
            'Payment': ['payment', 'progress payment', 'retention', 'payment terms'],
            'Warranty': ['warranty', 'guarantee period', 'warranty period'],
            'Liquidated Damages': ['liquidated damages', 'delay damages', 'penalty', 'per day'],
            'Bonding': ['bond', 'bid bond', 'performance bond', 'payment bond'],
            'Certifications': ['certification', 'nassco', 'pacp', 'required certifications'],
            'Insurance': ['insurance', 'liability', 'coverage requirements'],
            'Location': ['location', 'project location', 'city', 'municipality', 'address']
        };

        function extractKeyRequirements(sections) {
            const requirements = {};
            const allAnswers = [];

            // Collect all question-answer pairs
            sections.forEach(section => {
                (section.questions || []).forEach(q => {
                    if (q.answer && q.answer.trim()) {
                        allAnswers.push({
                            question: q.question.toLowerCase(),
                            answer: q.answer
                        });
                    }
                });
            });

            // Extract key requirements
            for (const [reqName, patterns] of Object.entries(KEY_REQUIREMENT_PATTERNS)) {
                for (const qa of allAnswers) {
                    const matchesPattern = patterns.some(p =>
                        qa.question.includes(p.toLowerCase()) ||
                        qa.answer.toLowerCase().includes(p.toLowerCase())
                    );
                    if (matchesPattern && !requirements[reqName]) {
                        // Truncate long answers
                        let value = qa.answer;
                        if (value.length > 150) {
                            value = value.substring(0, 150) + '...';
                        }
                        requirements[reqName] = value;
                        break;
                    }
                }
            }

            return requirements;
        }

        function renderSummaryTab(data, sessionId, mode) {
            const stats = data.statistics || {};
            const sections = data.result?.sections || [];
            const bestprepData = data.bestprep_data || {};  // BestPrep-specific data

            // Build fragment count map from bestprep_data (fragments tab data source)
            const fragmentCountMap = {};
            if (data.bestprep_data?.fragments) {
                data.bestprep_data.fragments.forEach(f => {
                    fragmentCountMap[f.question_id] = (fragmentCountMap[f.question_id] || 0) + 1;
                });
            }

            let totalQuestions = 0;
            let answeredQuestions = 0;
            let totalConfidence = 0;
            let confidenceCount = 0;
            let totalFragments = 0;
            let totalFootnotes = 0;
            let allPages = new Set();

            sections.forEach(section => {
                const questions = section.questions || [];
                totalQuestions += questions.length;
                questions.forEach(q => {
                    if (q.answer && q.answer.trim()) {
                        answeredQuestions++;
                        if (q.confidence) {
                            totalConfidence += q.confidence;
                            confidenceCount++;
                        }
                    }
                    // Count fragments for BestPrep - use fragmentCountMap first, fallback to q.fragment_count
                    const qFragCount = fragmentCountMap[q.question_id] || q.fragment_count || 0;
                    totalFragments += qFragCount;
                    if (q.footnote_count) {
                        totalFootnotes += q.footnote_count;
                    }
                    // Collect all pages
                    if (q.page_citations) {
                        q.page_citations.forEach(p => allPages.add(p));
                    }
                });
            });

            // Use bestprep_data counts as authoritative source if available
            const actualFragmentCount = data.bestprep_data?.fragments?.length || totalFragments;
            const actualFootnoteCount = data.bestprep_data?.footnotes?.length || totalFootnotes;

            const answerRate = totalQuestions > 0 ? Math.round((answeredQuestions / totalQuestions) * 100) : 0;
            const avgConfidence = confidenceCount > 0 ? Math.round(totalConfidence / confidenceCount) : 'N/A';
            const avgFragsPerQ = answeredQuestions > 0 ? (actualFragmentCount / answeredQuestions).toFixed(1) : '0';
            const avgFootnotesPerQ = answeredQuestions > 0 ? (actualFootnoteCount / answeredQuestions).toFixed(1) : '0';

            let html = '';

            // Mode-specific banner and summary
            if (mode === 'bestprep') {
                // BestPrep mode - Comprehensive analysis info (like Excel Summary sheet)
                html += `
                    <div style="background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px;">
                        <h3 style="margin: 0 0 8px 0; font-size: 16px;">BestPrep/TestPrep Analysis</h3>
                        <p style="margin: 0; opacity: 0.9; font-size: 13px;">Exhaustive analysis mode - all answer fragments preserved with full provenance</p>

                    <tbody>
                        <tr>
                            <td style="padding: 10px; font-weight: 600; background: #f9fafb; border: 1px solid #e5e7eb; width: 200px;">Table of Contents</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb;">
                                <span style="background: ${structure.has_toc ? '#dcfce7' : '#fee2e2'}; color: ${structure.has_toc ? '#166534' : '#991b1b'}; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">
                                    ${structure.has_toc ? 'Found' : 'Not Found'}
                                </span>
                                ${structure.toc_entries_count ? '<span style="color: #6b7280; margin-left: 8px;">(' + structure.toc_entries_count + ' entries)</span>' : ''}
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; font-weight: 600; background: #f9fafb; border: 1px solid #e5e7eb;">Index</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb;">
                                <span style="background: ${structure.has_index ? '#dcfce7' : '#fee2e2'}; color: ${structure.has_index ? '#166534' : '#991b1b'}; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">
                                    ${structure.has_index ? 'Found' : 'Not Found'}
                                </span>
                                ${structure.index_terms_count ? '<span style="color: #6b7280; margin-left: 8px;">(' + structure.index_terms_count + ' terms)</span>' : ''}
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; font-weight: 600; background: #f9fafb; border: 1px solid #e5e7eb;">Appendix</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb;">
                                <span style="background: ${structure.has_appendix ? '#dcfce7' : '#fee2e2'}; color: ${structure.has_appendix ? '#166534' : '#991b1b'}; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">
                                    ${structure.has_appendix ? 'Found' : 'Not Found'}
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <h3 style="margin: 0 0 15px 0; color: #1E3A8A; font-size: 16px;">Expert Page Assignments</h3>
            `;

            if (expertAssignments.length > 0) {
                html += `
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 25px;">
                        <thead>
                            <tr style="background: #1E3A8A; color: white;">
                                <th style="padding: 12px; text-align: left; font-weight: 600;">Expert</th>
                                <th style="padding: 12px; text-align: left; font-weight: 600;">Section</th>
                                <th style="padding: 12px; text-align: left; font-weight: 600;">Primary Pages</th>
                                <th style="padding: 12px; text-align: left; font-weight: 600;">Context Pages</th>
                                <th style="padding: 12px; text-align: center; font-weight: 600;">Total</th>
                                <th style="padding: 12px; text-align: left; font-weight: 600;">Keywords Matched</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                expertAssignments.forEach((assignment, idx) => {
                    const primaryPages = assignment.primary_pages || [];
                    const contextPages = assignment.context_pages || [];
                    const keywordsMatched = assignment.keywords_matched || [];
                    const isAlt = idx % 2 === 1;

                    html += `
                        <tr style="${isAlt ? 'background: #f9fafb;' : ''}">
                            <td style="padding: 10px; border: 1px solid #e5e7eb; font-weight: 600;">${assignment.expert || 'Unknown'}</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb;">${assignment.section_id || ''}</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb; font-size: 12px;">${primaryPages.slice(0, 10).join(', ')}${primaryPages.length > 10 ? '...' : ''}</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb; font-size: 12px;">${contextPages.slice(0, 10).join(', ')}${contextPages.length > 10 ? '...' : ''}</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb; text-align: center; font-weight: 600; color: #1E3A8A;">${assignment.total_pages || (primaryPages.length + contextPages.length)}</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb; font-size: 11px; color: #6b7280;">${keywordsMatched.slice(0, 3).join(', ')}${keywordsMatched.length > 3 ? '...' : ''}</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
            } else {
                html += `
                    <div style="padding: 20px; background: #fef3c7; border-radius: 8px; margin-bottom: 25px; color: #92400e;">
                        <strong>No targeted assignments:</strong> Document structure not found or all questions require exhaustive scan.
                    </div>
                `;
            }

            // Keywords by Section
            html += '<h3 style="margin: 25px 0 15px 0; color: #1E3A8A; font-size: 16px;">All Keywords Searched by Section</h3>';

            if (Object.keys(allKeywords).length > 0) {
                html += '<div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px;">';

                for (const [sectionId, keywords] of Object.entries(allKeywords)) {
                    html += `
                        <div style="flex: 1; min-width: 300px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px;">
                            <h4 style="margin: 0 0 10px 0; color: #1E3A8A; font-size: 14px;">${sectionId}</h4>
                            <div style="display: flex; flex-wrap: wrap; gap: 5px;">
                                ${(keywords || []).map(kw => '<span style="background: #E8EEF7; color: #1E3A8A; padding: 2px 8px; border-radius: 4px; font-size: 11px;">' + kw + '</span>').join('')}
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
            } else {
                html += '<p style="color: #6b7280; font-style: italic;">No keyword data available</p>';
            }

            // Efficiency Summary
            html += `
                <h3 style="margin: 25px 0 15px 0; color: #1E3A8A; font-size: 16px;">Efficiency Summary</h3>
                <table style="width: 50%; border-collapse: collapse; margin-bottom: 25px;">
                    <tbody>
                        <tr>
                            <td style="padding: 10px; font-weight: 600; background: #dcfce7; border: 1px solid #e5e7eb; width: 200px;">Estimated Page Reduction</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb; font-weight: 600; color: #166534;">${reduction}</td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; font-weight: 600; background: #f9fafb; border: 1px solid #e5e7eb;">Questions Requiring Full Scan</td>
                            <td style="padding: 10px; border: 1px solid #e5e7eb;">${unassigned.length}</td>
                        </tr>
                    </tbody>
                </table>
            `;

            document.getElementById('optimizedScanContent').innerHTML = html;
        }

        async function exportAnalysis(sessionId, mode) {
            // Use appropriate export endpoint based on mode
            if (mode === 'bestprep') {
                window.open(`/api/export/bestprep-excel/${sessionId}`, '_blank');
            } else {
                window.open(`/api/export/excel-dashboard/${sessionId}`, '_blank');
            }
        }

        function closeModal() {
            document.getElementById('resultsModal').style.display = 'none';
            currentResults = null;
        }

        window.onclick = function(event) {
            const modal = document.getElementById('resultsModal');
            if (event.target === modal) closeModal();
        }

        // Load on page load
        loadSessions();

        // Auto-refresh every 15 seconds
        setInterval(loadSessions, 15000);
    </script>
</body>
</html>
